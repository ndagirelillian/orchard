{% extends 'base.html' %}

{% block content %}
<div class="container-fluid py-3">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
    <div>
      <h1 class="h3 mb-1">Kitchen tickets</h1>
      <p class="text-muted mb-0">New orders appear automatically.</p>
    </div>
    <button id="enable-alerts" type="button" class="btn btn-outline-primary">
      Enable sound and notifications
    </button>
  </div>

  <style>
    .new-ticket {
      border: 3px solid #ffc107;
      box-shadow: 0 0 0 .25rem rgba(255, 193, 7, .2);
    }
  </style>
  <div id="new-ticket-alert" class="alert alert-warning d-none" role="alert" aria-live="assertive"></div>
  <div id="kitchen-tickets">
    {% include 'kitchen/_tickets.html' %}
  </div>
</div>

<script>
  const ticketContainer = document.getElementById("kitchen-tickets");
  const alertBanner = document.getElementById("new-ticket-alert");
  let audioEnabled = false;
  let audioContext;
  function getKnownOrderItems(cards) {
    return new Set(cards.flatMap((card) => card.dataset.orderItems.split(",").filter(Boolean)));
  }
  let knownOrderItemIds = getKnownOrderItems(
    Array.from(ticketContainer.querySelectorAll("[data-ticket-id]"))
  );

  document.getElementById("enable-alerts").addEventListener("click", async (event) => {
    audioEnabled = true;
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioContext = audioContext || new AudioContextClass();
      if (audioContext.state === "suspended") await audioContext.resume();
    }
    if ("Notification" in window && Notification.permission === "default") {
      try {
        await Notification.requestPermission();
      } catch (error) {
        console.warn("Browser notification permission was not granted.", error);
      }
    }
    event.currentTarget.textContent = "Sound and notifications enabled";
    event.currentTarget.disabled = true;
  });

  function playAlert() {
    if (!audioEnabled || !audioContext) return;
    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();
    oscillator.type = "sine";
    oscillator.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, audioContext.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, audioContext.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.45);
    oscillator.connect(gain);
    gain.connect(audioContext.destination);
    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.45);
  }

  let refreshInProgress = false;
  async function refreshTickets() {
    if (refreshInProgress) return;
    refreshInProgress = true;
    try {
      const url = new URL(window.location.href);
      url.searchParams.set("partial", "1");
      const response = await fetch(url, { headers: { "X-Requested-With": "XMLHttpRequest" } });
      if (!response.ok) throw new Error("Kitchen tickets could not be refreshed.");
      const html = await response.text();
      const incomingDocument = new DOMParser().parseFromString(html, "text/html");
      const incomingCards = Array.from(incomingDocument.querySelectorAll("[data-ticket-id]"));
      const newItems = incomingCards.flatMap((card) => {
        const newIds = card.dataset.orderItems.split(",").filter((id) => id && !knownOrderItemIds.has(id));
        return newIds.map(() => card.dataset.ticketLabel);
      });

      ticketContainer.innerHTML = html;
      knownOrderItemIds = getKnownOrderItems(incomingCards);

      if (newItems.length) {
        newItems.forEach((label) => {
          const currentCard = Array.from(ticketContainer.querySelectorAll("[data-ticket-id]"))
            .find((card) => card.dataset.ticketLabel === label);
          if (currentCard) currentCard.classList.add("new-ticket");
        });
        alertBanner.textContent = `${newItems.length} new kitchen item${newItems.length === 1 ? "" : "s"} received.`;
        alertBanner.classList.remove("d-none");
        playAlert();
        if (audioEnabled && "Notification" in window && Notification.permission === "granted") {
          try {
            new Notification("New kitchen order", {
              body: Array.from(new Set(newItems)).join(", "),
            });
          } catch (error) {
            console.warn("Desktop notification could not be displayed.", error);
          }
        }
      } else {
        alertBanner.classList.add("d-none");
      }
    } catch (error) {
      alertBanner.textContent = error.message || "Kitchen updates are temporarily unavailable.";
      alertBanner.classList.remove("d-none");
    } finally {
      refreshInProgress = false;
    }
  }

  window.setInterval(refreshTickets, 3000);
</script>
{% endblock %}
